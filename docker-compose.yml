version: "3.8"
services:
  rag-app:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./vector_db:/app/vector_db
      - ./data:/app/data
      - ./logs:/app/logs
      - ./monitoring:/app/monitoring
      - ./.env:/app/.env
    environment:
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
